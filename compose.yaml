name: nusend

# The protected env file is optional only while rendering `compose config` on a
# workstation. Production API/worker startup still fails closed without its
# required auth/sending values. Operators install it at /etc/nusend/nusend.env.
x-app-service: &app-service
  image: ${NUSEND_APP_IMAGE:?Set NUSEND_APP_IMAGE to an immutable image digest}
  env_file:
    - path: ${NUSEND_RUNTIME_ENV_FILE:-/etc/nusend/nusend.env}
      format: raw
      required: false
  environment:
    NODE_ENV: production
    NUSEND_DB_PATH: /var/lib/nusend/nusend.sqlite
    NUSEND_HOST: 0.0.0.0
    NUSEND_PORT: "3000"
  user: "10001:10001"
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - type: bind
      source: ${NUSEND_DB_DIR:-/var/lib/nusend}
      target: /var/lib/nusend
      bind:
        create_host_path: false

services:
  api:
    <<: *app-service
    command: ["bun", "apps/service/src/main.ts"]
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3000/health/db');if(!r.ok)process.exit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 20s
    logging:
      driver: journald
      options:
        tag: nusend-api

  worker:
    <<: *app-service
    command: ["bun", "apps/service/src/sending/worker-main.ts", "loop"]
    restart: unless-stopped
    stop_signal: SIGTERM
    # Default 300-second lease plus the required 60-second completion margin.
    stop_grace_period: 6m
    logging:
      driver: journald
      options:
        tag: nusend-worker

  migrate:
    <<: *app-service
    profiles: ["ops"]
    command: ["bun", "apps/service/src/db/migrate.ts", "up"]
    restart: "no"
    stop_signal: SIGTERM
    stop_grace_period: 30s
    logging:
      driver: journald
      options:
        tag: nusend-migrate

  # This immutable registry image intentionally does not inherit the
  # application env file or writable application DB mount.
  backup:
    profiles: ["ops"]
    image: ${NUSEND_BACKUP_IMAGE:?Set NUSEND_BACKUP_IMAGE to an immutable image digest}
    entrypoint: ["/usr/local/bin/backup.sh"]
    environment:
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/r2_access_key_id
      AWS_DEFAULT_REGION: auto
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/r2_secret_access_key
      NUSEND_BACKUP_SOURCE: /source/nusend.sqlite
      NUSEND_BACKUP_WORK_DIR: /work
      RESTIC_HOST: nusend
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      R2_ACCOUNT_ID: ${NUSEND_R2_ACCOUNT_ID:-replace-with-r2-account-id}
      R2_BUCKET: ${NUSEND_R2_BUCKET:-replace-with-private-bucket-name}
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    volumes:
      - type: bind
        source: ${NUSEND_DB_DIR:-/var/lib/nusend}
        target: /source
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NUSEND_BACKUP_WORK_DIR:-/var/lib/nusend-backup}
        target: /work
        bind:
          create_host_path: false
    secrets:
      - r2_access_key_id
      - r2_secret_access_key
      - restic_password
    logging:
      driver: journald
      options:
        tag: nusend-backup

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      NUSEND_DOMAIN: ${NUSEND_DOMAIN:?Set NUSEND_DOMAIN to the Cloudflare-proxied hostname}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 10s
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - type: bind
        source: ${NUSEND_CADDY_CONFIG_DIR:-/opt/nusend/deploy/caddy}
        target: /etc/caddy
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NUSEND_CADDY_DATA_DIR:-/var/lib/nusend-caddy/data}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${NUSEND_CADDY_RUNTIME_CONFIG_DIR:-/var/lib/nusend-caddy/config}
        target: /config
        bind:
          create_host_path: false
    secrets:
      - caddy_origin_cert
      - caddy_origin_key
    logging:
      driver: journald
      options:
        tag: nusend-caddy

secrets:
  caddy_origin_cert:
    file: ${NUSEND_ORIGIN_CERT_FILE:-/etc/nusend/secrets/cloudflare-origin.pem}
  caddy_origin_key:
    file: ${NUSEND_ORIGIN_KEY_FILE:-/etc/nusend/secrets/cloudflare-origin-key.pem}
  r2_access_key_id:
    file: ${NUSEND_R2_ACCESS_KEY_ID_FILE:-/etc/nusend/secrets/r2-access-key-id}
  r2_secret_access_key:
    file: ${NUSEND_R2_SECRET_ACCESS_KEY_FILE:-/etc/nusend/secrets/r2-secret-access-key}
  restic_password:
    file: ${NUSEND_RESTIC_PASSWORD_FILE:-/etc/nusend/secrets/restic-password}
