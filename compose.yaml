name: nusend

# Maintainers update these release tags with each published GHCR release.
x-app-image: &app-image ghcr.io/maxedapps/nusend:v0.1.2
x-backup-image: &backup-image ghcr.io/maxedapps/nusend-backup:v0.1.2
x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

x-app-environment: &app-environment
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
  AWS_REGION: ${AWS_REGION:?Set AWS_REGION}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: https://${NUSEND_DOMAIN:?Set NUSEND_DOMAIN}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}
  NODE_ENV: production
  NUSEND_API_KEY_HASH_SECRET: ${NUSEND_API_KEY_HASH_SECRET:?Set NUSEND_API_KEY_HASH_SECRET}
  NUSEND_AUTH_TRUSTED_ORIGINS: https://${NUSEND_DOMAIN:?Set NUSEND_DOMAIN}
  NUSEND_DB_PATH: /var/lib/nusend/nusend.sqlite
  NUSEND_HOST: 0.0.0.0
  NUSEND_PORT: "3000"
  NUSEND_PUBLIC_BASE_URL: https://${NUSEND_DOMAIN:?Set NUSEND_DOMAIN}
  NUSEND_SES_FEEDBACK_TOPIC_ARNS: ${NUSEND_SES_FEEDBACK_TOPIC_ARNS:-}
  NUSEND_SES_FROM_EMAIL: ${NUSEND_SES_FROM_EMAIL:?Set NUSEND_SES_FROM_EMAIL}
  NUSEND_SES_MARKETING_CONFIGURATION_SET: ${NUSEND_SES_MARKETING_CONFIGURATION_SET:-}
  NUSEND_SES_TRACKING_CUSTOM_REDIRECT_DOMAIN: ${NUSEND_SES_TRACKING_CUSTOM_REDIRECT_DOMAIN:-}
  NUSEND_SES_TRACKING_EVENTS: ${NUSEND_SES_TRACKING_EVENTS:-}
  NUSEND_SES_TRANSACTIONAL_CONFIGURATION_SET: ${NUSEND_SES_TRANSACTIONAL_CONFIGURATION_SET:?Set NUSEND_SES_TRANSACTIONAL_CONFIGURATION_SET}
  NUSEND_UNSUBSCRIBE_PREVIOUS_SECRET: ${NUSEND_UNSUBSCRIBE_PREVIOUS_SECRET:-}
  NUSEND_UNSUBSCRIBE_SECRET: ${NUSEND_UNSUBSCRIBE_SECRET:?Set NUSEND_UNSUBSCRIBE_SECRET}

x-app-service: &app-service
  image: *app-image
  environment: *app-environment
  user: "10001:10001"
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - type: volume
      source: nusend-data
      target: /var/lib/nusend
  logging: *default-logging

services:
  api:
    <<: *app-service
    command: ["bun", "apps/service/src/main.ts"]
    expose:
      - "3000"
    pre_start:
      - image: busybox:1.37.0-musl@sha256:222ad6d973c0d198014546a65cd02c5fdedcc172123c5b4c2bf0af636550bd94
        user: "0:0"
        command:
          [
            "sh",
            "-c",
            "chown 10001:10001 /var/lib/nusend && chmod 0700 /var/lib/nusend",
          ]
      - user: "10001:10001"
        command: ["bun", "apps/service/src/db/migrate.ts", "up"]
      - user: "10001:10001"
        command:
          [
            "bun",
            "apps/service/src/auth/bootstrap.ts",
            "--email",
            "${NUSEND_OWNER_EMAIL:?Set NUSEND_OWNER_EMAIL}",
            "--name",
            "${NUSEND_OWNER_NAME:?Set NUSEND_OWNER_NAME}",
          ]
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3000/health/db');if(!r.ok)process.exit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 20s

  worker:
    <<: *app-service
    command: ["bun", "apps/service/src/sending/worker-main.ts", "loop"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_signal: SIGTERM
    # Default 300-second lease plus the required 60-second completion margin.
    stop_grace_period: 6m

  backup:
    image: *backup-image
    command: ["schedule"]
    environment:
      AWS_ACCESS_KEY_ID: ${NUSEND_R2_ACCESS_KEY_ID:?Set NUSEND_R2_ACCESS_KEY_ID}
      AWS_DEFAULT_REGION: auto
      AWS_SECRET_ACCESS_KEY: ${NUSEND_R2_SECRET_ACCESS_KEY:?Set NUSEND_R2_SECRET_ACCESS_KEY}
      NUSEND_BACKUP_SOURCE: /var/lib/nusend/nusend.sqlite
      NUSEND_BACKUP_WORK_DIR: /work
      RESTIC_HOST: nusend
      RESTIC_PASSWORD: ${NUSEND_RESTIC_PASSWORD:?Set NUSEND_RESTIC_PASSWORD}
      RESTIC_REPOSITORY: ${NUSEND_RESTIC_REPOSITORY:?Set NUSEND_RESTIC_REPOSITORY}
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    pre_start:
      - image: busybox:1.37.0-musl@sha256:222ad6d973c0d198014546a65cd02c5fdedcc172123c5b4c2bf0af636550bd94
        user: "0:0"
        command:
          ["sh", "-c", "chown 10001:10001 /work && chmod 0700 /work"]
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "test -f /work/.nusend-backup-healthy && test $(($(date +%s) - $(cat /work/.nusend-backup-healthy))) -lt 90000",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15m
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 2m
    volumes:
      - type: volume
        source: nusend-data
        target: /var/lib/nusend
      - type: volume
        source: nusend-backup-work
        target: /work
    logging: *default-logging

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    command:
      [
        "run",
        "--config",
        "/etc/nusend-caddy/${NUSEND_INGRESS_MODE:?Set NUSEND_INGRESS_MODE to direct or cloudflare}/Caddyfile",
        "--adapter",
        "caddyfile",
      ]
    environment:
      NUSEND_DOMAIN: ${NUSEND_DOMAIN:?Set NUSEND_DOMAIN}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 10s
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - type: bind
        source: ./deploy/caddy
        target: /etc/nusend-caddy
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: nusend-caddy-data
        target: /data
      - type: volume
        source: nusend-caddy-config
        target: /config
    logging: *default-logging

volumes:
  nusend-data:
  nusend-backup-work:
  nusend-caddy-data:
  nusend-caddy-config:
